# @package _global_

# to execute this experiment run:
# python train.py experiment=example

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters
defaults:
  - override /energy: hd_gmm
  - override /model/noise_schedule: geometric
  - override /paths: rebuttal

tags: ["GMM", "iDEM"]

seed: 12345

logger:
  wandb:
    tags: ${tags}
    group: "gmm"

trainer:
  max_epochs: 50
  check_val_every_n_epoch: 5  
  gradient_clip_val: 0.5  
  devices: 8 
  strategy: ddp  
  sync_batchnorm: true

model:
  noise_schedule:
    _target_: dem.models.components.noise_schedules.GeometricNoiseSchedule
    sigma_min: 0.00001
    sigma_max: 1.0

  buffer:
    prioritize: false
    max_length: 50000
    min_sample_length: 1000 

  partial_prior:
    _target_: dem.energies.base_prior.Prior
    _partial_: true
    dim: ${energy.dimensionality}

  clipper:
    _target_: dem.models.components.clipper.Clipper
    should_clip_scores: True
    should_clip_log_rewards: False
    max_score_norm: 70
    min_log_reward: null

  lambda_weighter:
    _target_: dem.models.components.lambda_weighter.BasicLambdaWeighter
    _partial_: true
    epsilon: 1e-3

  optimizer:
    lr: 5e-4

  diffusion_scale: 1.0

  # this has to be max 1000 since test_set is 1000
  eval_batch_size: 1000

  init_from_prior: true
  num_init_samples: 10000
  num_estimator_mc_samples: 1000
  num_samples_to_generate_per_epoch: 5120
  num_samples_to_sample_from_buffer: 5120
  use_snis: true
  num_samples_to_snis: 2
  explore_ratio: .5
  num_samples_to_snis_denominator: 5120
  # use_buffer: false

energy:
  dimensionality: 64
  n_mixes: 2